services:
  jellyfin:
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: jellyfin
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Kolkata
    volumes:
      - ./config:/config
      - /data/downloads:/media  # Adjust this path to where your media is stored
      - /home/madhur/Videos:/media4  # Adjust this path to where your media is stored
      - /home/madhur/Screenshots/Timeline:/media2  # Adjust this path to where your media is stored
      - /data/be_discussions:/media3  # Adjust this path to where your media is stored      - ./cache:/cache
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu, compute, video]
    networks:
      - proxy-network
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy-network"
      - "traefik.http.services.jellyfin.loadbalancer.server.port=8096"

      # WAN router: no ForwardAuth (removed 2026-09-10, confirmed working).
      # Jellyfin's own SSO-Auth plugin (OIDC via Authelia, client "jellyfin"
      # in authelia/config/configuration.yml, provider key "sso-auth") gates
      # browser logins via the SSO button; native apps (mobile/TV/Kodi) use
      # normal Jellyfin credentials. ForwardAuth was dropped because it
      # double-gated Jellyfin's own bootstrap/API calls (e.g.
      # /System/Info/Public, /System/Info), causing endless-loading-spinner
      # races and blocking native app logins entirely. Do not re-add
      # ForwardAuth here without expecting that same breakage.
      - "traefik.http.routers.jellyfin.rule=Host(`jf.desktop.madhur.co.in`)"
      - "traefik.http.routers.jellyfin.entrypoints=websecure"
      - "traefik.http.routers.jellyfin.tls.certresolver=letencrypt"
      - "traefik.http.routers.jellyfin.service=jellyfin"

networks:
  proxy-network:
    external: true
