services:
  changedetection:
    image: ghcr.io/dgtlmoon/changedetection.io
    container_name: changedetection
    # ports:
    #   - "5000:5000"
    environment:
      - PLAYWRIGHT_DRIVER_URL=ws://playwright-chrome:3000
    volumes:
      - ./data:/datastore
    restart: unless-stopped
    depends_on:
      playwright-chrome:
        condition: service_healthy
    labels:
        - "traefik.enable=true"
        - "traefik.docker.network=proxy-network"
        - "traefik.http.services.changedetection.loadbalancer.server.port=5000"

        # LAN/VPN router: no auth (higher priority)
        - "traefik.http.routers.changedetection-local.rule=Host(`cd.desktop.madhur.co.in`) && (ClientIP(`192.168.1.0/24`) || ClientIP(`10.42.42.0/24`) || ClientIP(`172.22.0.0/16`))"
        - "traefik.http.routers.changedetection-local.entrypoints=websecure"
        - "traefik.http.routers.changedetection-local.tls.certresolver=letencrypt"
        - "traefik.http.routers.changedetection-local.service=changedetection"
        - "traefik.http.routers.changedetection-local.priority=10"

        # Internet router: Authelia forward-auth (lower priority)
        - "traefik.http.routers.changedetection.rule=Host(`cd.desktop.madhur.co.in`)"
        - "traefik.http.routers.changedetection.entrypoints=websecure"
        - "traefik.http.routers.changedetection.tls.certresolver=letencrypt"
        - "traefik.http.routers.changedetection.middlewares=authelia@file"
        - "traefik.http.routers.changedetection.service=changedetection"
        - "traefik.http.routers.changedetection.priority=1"
    networks:
      - proxy-network

  playwright-chrome:
    image: browserless/chrome:latest
    container_name: playwright-chrome
    environment:
      - SCREEN_WIDTH=1920
      - SCREEN_HEIGHT=1080
      - SCREEN_DEPTH=24
      - ENABLE_DEBUGGER=false
      - PREBOOT_CHROME=true
      - CONNECTION_TIMEOUT=300000
      - MAX_CONCURRENT_SESSIONS=10
      - CHROME_REFRESH_TIME=600000
      - DEFAULT_BLOCK_ADS=true
      - DEFAULT_STEALTH=true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/json/version"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - proxy-network

networks:
  proxy-network:
    external: true