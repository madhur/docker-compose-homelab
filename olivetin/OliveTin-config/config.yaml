  - title: "Clean Docker System (Full)"
    icon: "&#128165;"
    shell: ssh -F /config/ssh/easy.cfg madhur@local.madhur.co.in 'docker system prune -af --volumes'
    timeout: 600
    confirm: true
    confirmMessage: "WARNING: This will remove all unused containers, networks, images, and volumes! Are you sure?"

  - title: "Remove Dockcheck Backups (>7 days)"
    icon: "&#128465;"
    shell: ssh -F /config/ssh/easy.cfg madhur@local.madhur.co.in 'docker images --format "{{.Repository}} {{.Tag}}" | grep "^dockcheck" | while read repo tag; do backup_date="${tag%%_*}"; image_epoch=$(date -d "$backup_date" +%s 2>/dev/null || echo 0); current_epoch=$(date +%s); days_old=$(( (current_epoch - image_epoch) / 86400 )); if [ $days_old -gt 7 ]; then docker rmi "${repo}:${tag}"; fi; done'
    timeout: 300
    confirm: true
    confirmMessage: "Remove Docker image backups older than 7 days?"

