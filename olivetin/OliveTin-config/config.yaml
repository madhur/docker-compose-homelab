saveLogs:
  resultsDirectory: /var/log/olivetin/results/
  outputDirectory: /var/log/olivetin/output/

sectionNavigationStyle: topbar

actions:

  # ===== Teams Video Downloader =====
  - title: "Download Teams Video"
    icon: "&#127909;"
    exec:
      - ssh
      - -F
      - /config/ssh/easy.cfg
      - madhur@local.madhur.co.in
      - cd /home/madhur/Desktop/python && /home/madhur/.virtualenvs/python-rsha/bin/python /home/madhur/Desktop/python/temporal_worker_wrapper.py download "{{ url }}" "{{ output }}" "{{ mode }}"
    timeout: 120
    arguments:
      - name: url
        title: "Teams/SharePoint Recording URL"
        type: url
        description: "The SharePoint recording URL from MS Teams"
      - name: output
        title: "Output Filename"
        type: ascii_sentence
        description: "Filename only (will be saved to /data/)"
      - name: mode
        title: "Download Mode"
        type: ascii_identifier
        default: "fast"
        description: "fast (quick encoding), copy (no encoding), or quality (best quality)"
        choices:
          - value: "fast"
            title: "Fast (quick encoding)"
          - value: "copy"
            title: "Copy (no re-encoding)"
          - value: "quality"
            title: "Quality (best quality)"

  - title: "Download Teams Video (Prefect)"
    id: download-teams-video-prefect
    icon: "&#127909;"
    exec:
      - ssh
      - -F
      - /config/ssh/easy.cfg
      - madhur@local.madhur.co.in
      - cd /home/madhur/Desktop/python && PREFECT_API_URL=http://localhost:4200/api /home/madhur/.virtualenvs/python-rsha/bin/python /home/madhur/Desktop/python/prefect-worker.py download "{{ url }}" "{{ mode }}"
    timeout: 30
    arguments:
      - name: url
        title: "Teams/SharePoint Recording URL"
        type: very_dangerous_raw_string
        description: "The SharePoint recording URL from MS Teams"
      - name: mode
        title: "Download Mode"
        type: ascii_identifier
        default: "fast"
        description: "fast (quick encoding), copy (no encoding), or quality (best quality)"
        choices:
          - value: "fast"
            title: "Fast (quick encoding)"
          - value: "copy"
            title: "Copy (no re-encoding)"
          - value: "quality"
            title: "Quality (best quality)"

  - title: "Download Teams Video (yt-dlp)"
    id: download-teams-video-ytdlp
    icon: "&#127909;"
    exec:
      - ssh
      - -F
      - /config/ssh/easy.cfg
      - madhur@local.madhur.co.in
      - cd /home/madhur/Desktop/python && PREFECT_API_URL=http://localhost:4200/api /home/madhur/.virtualenvs/python-rsha/bin/python /home/madhur/Desktop/python/prefect-ytdlp-worker.py download "{{ url }}"
    timeout: 30
    arguments:
      - name: url
        title: "Teams/SharePoint Recording URL"
        type: very_dangerous_raw_string
        description: "The SharePoint recording URL from MS Teams"

  - title: "Shutdown System"
    icon: "&#9211;"
    shell: ssh -F /config/ssh/easy.cfg madhur@local.madhur.co.in 'sudo shutdown -h now'
    timeout: 30

  - title: "Enable Idle Shutdown"
    icon: "&#128164;"
    shell: ssh -F /config/ssh/easy.cfg madhur@local.madhur.co.in 'if systemctl --user is-active --quiet idle-shutdown.timer; then echo "Idle Shutdown already ENABLED"; else systemctl --user start idle-shutdown.timer && echo "Idle Shutdown Enabled"; fi'
    timeout: 30

  - title: "Disable Idle Shutdown"
    icon: "&#9889;"
    shell: ssh -F /config/ssh/easy.cfg madhur@local.madhur.co.in 'if systemctl --user is-active --quiet idle-shutdown.timer; then systemctl --user stop idle-shutdown.timer && echo "Idle Shutdown Disabled"; else echo "Idle Shutdown already DISABLED"; fi'
    timeout: 30

  - title: "Check Idle Shutdown Status"
    icon: "&#128336;"
    shell: ssh -F /config/ssh/easy.cfg madhur@local.madhur.co.in 'if systemctl --user is-active --quiet idle-shutdown.timer; then echo "Idle Shutdown is ENABLED, remaining=$(~/scripts/idle-remaining-plain.sh)"; else echo "Idle Shutdown is DISABLED"; fi'
    timeout: 30

  - title: "Extend Idle Shutdown"
    icon: "&#9203;"
    shell: ssh -F /config/ssh/easy.cfg madhur@local.madhur.co.in '~/scripts/idle-extend.sh && echo "Idle timer extended" || echo "Extend failed - no logged-in ttys found"'
    timeout: 30

