services:
  woodpecker-server:
    image: woodpeckerci/woodpecker-server:v3
    container_name: woodpecker-server
    environment:
      - TZ=Asia/Kolkata
      - WOODPECKER_OPEN=true
      - WOODPECKER_HOST=https://woodpecker.desktop.madhur.co.in
      - WOODPECKER_AGENT_SECRET=${WOODPECKER_AGENT_SECRET}
      - WOODPECKER_FORGEJO=true
      - WOODPECKER_FORGEJO_URL=https://forgejo.desktop.madhur.co.in
      - WOODPECKER_FORGEJO_CLIENT=${WOODPECKER_FORGEJO_CLIENT}
      - WOODPECKER_FORGEJO_SECRET=${WOODPECKER_FORGEJO_SECRET}
    volumes:
      - ./data-server:/var/lib/woodpecker
    restart: unless-stopped
    networks:
      - proxy-network
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy-network"
      - "traefik.http.services.woodpecker.loadbalancer.server.port=8000"

      # Directly exposed, no Authelia — auth handled by Forgejo OAuth.
      # Forward-auth would intercept the OAuth token exchange / webhook
      # calls with a login redirect instead of a JSON/API response.
      - "traefik.http.routers.woodpecker.rule=Host(`woodpecker.desktop.madhur.co.in`)"
      - "traefik.http.routers.woodpecker.entrypoints=websecure"
      - "traefik.http.routers.woodpecker.tls.certresolver=letencrypt"
      - "traefik.http.routers.woodpecker.service=woodpecker"

  woodpecker-agent:
    image: woodpeckerci/woodpecker-agent:v3
    container_name: woodpecker-agent
    command: agent
    environment:
      - TZ=Asia/Kolkata
      - WOODPECKER_SERVER=woodpecker-server:9000
      - WOODPECKER_AGENT_SECRET=${WOODPECKER_AGENT_SECRET}
      - WOODPECKER_MAX_WORKFLOWS=2
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
    networks:
      - proxy-network
    depends_on:
      - woodpecker-server

networks:
  proxy-network:
    external: true
