services:
  ghostfolio:
    image: docker.io/ghostfolio/ghostfolio:latest
    container_name: ghostfolio
    init: true
    environment:
      - TZ=Asia/Kolkata
      - NODE_ENV=production
      - PORT=3333
      # Host Postgres (see project-host-postgres memory)
      - DATABASE_URL=postgresql://ghostfolio:1afd912aea41853206974749984ccb04@host.docker.internal:5432/ghostfolio?connect_timeout=300&sslmode=disable
      # Host Redis (no auth) — db6 (db0/1/4/5 already in use)
      - REDIS_HOST=host.docker.internal
      - REDIS_PORT=6379
      - REDIS_DB=6
      - ACCESS_TOKEN_SALT=81dd22046e8c52bad61bd1a8d64fba5439ee2ef9a1011c7947ed0853dcac745a
      - JWT_SECRET_KEY=1a0bcd9160287c6d8887c073021dc59b21ae1b5e19db361b4959a96a592ee226
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    networks:
      - proxy-network
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy-network"
      - "traefik.http.services.ghostfolio.loadbalancer.server.port=3333"

      # LAN/VPN router: no auth (higher priority)
      - "traefik.http.routers.ghostfolio-local.rule=Host(`ghostfolio.desktop.madhur.co.in`) && (ClientIP(`192.168.1.0/24`) || ClientIP(`10.42.42.0/24`) || ClientIP(`172.22.0.0/16`))"
      - "traefik.http.routers.ghostfolio-local.entrypoints=websecure"
      - "traefik.http.routers.ghostfolio-local.tls.certresolver=letencrypt"
      - "traefik.http.routers.ghostfolio-local.service=ghostfolio"
      - "traefik.http.routers.ghostfolio-local.priority=10"

      # Internet router: Authelia forward-auth (lower priority)
      - "traefik.http.routers.ghostfolio.rule=Host(`ghostfolio.desktop.madhur.co.in`)"
      - "traefik.http.routers.ghostfolio.entrypoints=websecure"
      - "traefik.http.routers.ghostfolio.tls.certresolver=letencrypt"
      - "traefik.http.routers.ghostfolio.middlewares=authelia@file"
      - "traefik.http.routers.ghostfolio.service=ghostfolio"
      - "traefik.http.routers.ghostfolio.priority=1"

networks:
  proxy-network:
    external: true
